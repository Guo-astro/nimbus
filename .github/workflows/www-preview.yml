name: www Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: www-preview-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build www
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nimbus/www run predeploy

      - name: Identify the commit served by this build
        run: printf '%s\n' "$HEAD_SHA" > apps/www/dist/_nimbus-preview-sha.txt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: www-dist
          path: apps/www/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy or clean up www Preview
    needs: build
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check the current PR state
        id: current
        run: |
          if [ "$EVENT" = 'push' ]; then
            if [ "$BUILD_RESULT" = 'success' ]; then echo 'mode=deploy' >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha] | join(" ")')
          read -r state head_sha <<< "$current"
          if [ "$state" = 'closed' ]; then
            echo 'mode=delete' >> "$GITHUB_OUTPUT"
          elif [ "$BUILD_RESULT" = 'success' ] && [ "$head_sha" = "$EVENT_SHA" ]; then
            echo 'mode=deploy' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RESULT: ${{ needs.build.result }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.current.outputs.mode != ''
        with:
          ref: ${{ steps.current.outputs.mode == 'delete' && 'main' || (github.event.pull_request.head.sha || github.sha) }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.current.outputs.mode != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.current.outputs.mode != ''
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.mode != ''

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.current.outputs.mode == 'deploy'
        with:
          name: www-dist
          path: apps/www/dist

      - name: Deploy and probe Preview
        if: steps.current.outputs.mode == 'deploy'
        id: preview
        working-directory: apps/www
        run: |
          name='main'
          if [ "$EVENT" = 'pull_request' ]; then name="pr-$PR"; fi
          output=$(pnpm exec wrangler preview --name "$name" --json)
          url=$(jq -er '.preview.urls[0] | select(startswith("https://"))' <<< "$output")
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$url/registry/registry.json" | jq -e \
            --arg version "$(jq -r .version ../../packages/nimbus-docs/package.json)" \
            '.registryVersion == $version'
          served_sha=$(curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$url/_nimbus-preview-sha.txt")
          test "$served_sha" = "$EVENT_SHA"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Link the successful PR Preview
        if: steps.preview.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha] | join(" ")')
          read -r state head_sha <<< "$current"
          if [ "$state" != 'open' ] || [ "$head_sha" != "$EVENT_SHA" ]; then exit 0; fi
          gh api -X POST "repos/$REPO/statuses/$EVENT_SHA" \
            -f state=success -f context=www/preview \
            -f description='Live docs and registry Preview' \
            -f target_url="$URL" --jq '.state'
          body=$(printf '<!-- nimbus-www-preview -->\nwww Preview: %s\n\nTest its registry: `NIMBUS_REGISTRY_URL=%s/registry`\n' "$URL" "$URL")
          comment=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- nimbus-www-preview -->"))) | .id')
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$(printf '%s\n' "$comment" | sort -n | tail -1)" -f body="$body" --jq '.id'
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --jq '.id'
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}

      - name: Delete closed PR Preview
        if: steps.current.outputs.mode == 'delete'
        working-directory: apps/www
        run: |
          name="pr-$PR"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/nimbus-docs/previews/$name")
          if [ "$status" = '404' ]; then
            echo 'Preview already absent.'
          elif [ "$status" = '200' ]; then
            pnpm exec wrangler preview delete --name "$name" --skip-confirmation
          else
            echo "::error::Could not check Preview before deletion (HTTP $status)."
            exit 1
          fi
          gh api -X POST "repos/$REPO/statuses/$EVENT_SHA" \
            -f state=error -f context=www/preview \
            -f description='PR Preview was closed' --jq '.state'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
