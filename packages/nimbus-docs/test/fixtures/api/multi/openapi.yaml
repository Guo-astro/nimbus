openapi: 3.1.0
info:
  title: Multi-file API
  version: 2.0.0
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    Local:
      $ref: "./schemas.yaml#/components/schemas/Pet"
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas.yaml#/components/schemas/Pet"
  /owners/{id}:
    $ref: "./paths/owner.yaml"
