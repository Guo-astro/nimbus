name: CI

# Red/green signal on every PR: typecheck, test, and dependency regressions.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default-deny; each job opts back into the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root script builds nimbus-docs, then runs `pnpm -r typecheck`.
      - run: pnpm typecheck

  # The nimbus-docs suite runs in four shards per lane, each a slice of the
  # file list from scripts/shard-files.mjs, with a report of the files it ran.
  # `other` runs the upgrade tests and the remaining packages. Each lane's
  # summary job below checks that every file ran on exactly one shard.
  test-current:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, label: 1/4 }
          - { shard: 2, label: 2/4 }
          - { shard: 3, label: 3/4 }
          - { shard: 4, label: 4/4 }
          - { shard: other, label: other }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./packages/nimbus-docs build

      - if: matrix.shard == 'other'
        run: pnpm test:upgrades

      - if: matrix.shard == 'other'
        run: pnpm -r --filter '!@cloudflare/nimbus-docs' test

      # The packed-migration test installs a published release from npm and
      # packs this one. A packed tarball can only regress at a release, so it
      # runs on main and the release PR, not on every feature PR.
      - if: matrix.shard != 'other'
        working-directory: packages/nimbus-docs
        run: |
          files=$(node scripts/shard-files.mjs ${{ matrix.label }})
          node --import tsx --test --test-concurrency=4 --test-timeout=600000 --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/test-file-summary-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/report-${{ matrix.shard }}.ndjson" \
            $files
        env:
          TEST_SHARD: ${{ matrix.label }}
          RUN_PACKED_MIGRATION: ${{ github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'changeset-release/') }}

      # A shard that hits timeout-minutes is cancelled and uploads nothing; the
      # summary then reports it as a missing report.
      - if: ${{ matrix.shard != 'other' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-current-${{ matrix.shard }}
          path: ${{ runner.temp }}/report-${{ matrix.shard }}.ndjson
          overwrite: true
          retention-days: 7

  # `next` applies pending changesets exactly as the release PR will (versions,
  # CHANGELOGs, reviewed baselines, registry) before testing, so a test that
  # depends on the version fails here instead of on the release PR. Nothing is
  # committed.
  test-next:
    name: Test at the next release version (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, label: 1/4 }
          - { shard: 2, label: 2/4 }
          - { shard: 3, label: 3/4 }
          - { shard: 4, label: 4/4 }
          - { shard: other, label: other }
    permissions:
      contents: read
      pull-requests: read # changelog-github reads the PR behind each changeset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # changelog-github finds the commit that added each changeset

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm --filter ./packages/nimbus-docs build

      - if: matrix.shard == 'other'
        run: pnpm test:upgrades

      - if: matrix.shard == 'other'
        run: pnpm -r --filter '!@cloudflare/nimbus-docs' test

      - if: matrix.shard != 'other'
        working-directory: packages/nimbus-docs
        run: |
          files=$(node scripts/shard-files.mjs ${{ matrix.label }})
          node --import tsx --test --test-concurrency=4 --test-timeout=600000 --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/test-file-summary-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/report-${{ matrix.shard }}.ndjson" \
            $files
        env:
          TEST_SHARD: ${{ matrix.label }}
          RUN_PACKED_MIGRATION: ${{ github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'changeset-release/') }}

      - if: ${{ matrix.shard != 'other' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-next-${{ matrix.shard }}
          path: ${{ runner.temp }}/report-${{ matrix.shard }}.ndjson
          overwrite: true
          retention-days: 7

  # One check per lane under its old name. It fails if any shard failed or was
  # cancelled, or if the shard reports don't cover every test file exactly once.
  test:
    name: Test
    needs: test-current
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-report-current-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - working-directory: packages/nimbus-docs
        run: |
          node scripts/check-test-reports.mjs --reports "$RUNNER_TEMP/reports" --shards 4 --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" || status=$?
          test "$LANE_RESULT" = success || { echo "::error::test-current finished with result '$LANE_RESULT'"; exit 1; }
          exit "${status:-0}"
        env:
          LANE_RESULT: ${{ needs.test-current.result }}

  test-next-summary:
    name: Test at the next release version
    needs: test-next
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-report-next-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - working-directory: packages/nimbus-docs
        run: |
          node scripts/check-test-reports.mjs --reports "$RUNNER_TEMP/reports" --shards 4 --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" || status=$?
          test "$LANE_RESULT" = success || { echo "::error::test-next finished with result '$LANE_RESULT'"; exit 1; }
          exit "${status:-0}"
        env:
          LANE_RESULT: ${{ needs.test-next.result }}

  # The docs site is otherwise built only when it's deployed, after a
  # release; build it on every PR so a broken page or a framework change that
  # breaks it fails here.
  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@nimbus/www..." build

  # The weather demo is deployed with each release; check and build it on
  # every PR so a framework or starter change that breaks it fails here.
  demo-weather:
    name: Weather demo build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@nimbus/demo-weather^..." build

      - run: pnpm --filter @nimbus/demo-weather check

      - run: pnpm --filter @nimbus/demo-weather build

  windows-child-process:
    name: Windows child process
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/child-process.test.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  registry-scope:
    name: Registry scope guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nimbus/www generate-registry

      # Registry payloads must import the scoped package. A bare
      # `grep 'from "nimbus-docs'` false-passes because the JSON escapes the
      # quote — match the escaped form / parse `.files[].content`.
      - name: Assert no unscoped nimbus-docs imports
        run: |
          hits=$(grep -rl 'from \\"nimbus-docs' apps/www/public/registry/components || true)
          if [ -n "$hits" ]; then
            echo "::error::Registry payloads import the unscoped nimbus-docs. Regenerate from the scoped source:"
            echo "$hits"
            exit 1
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject vulnerable production dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false
          show-patched-versions: true
