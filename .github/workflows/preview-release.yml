name: Preview release

# On-demand preview builds for a PR, served by pkg.pr.new (https://pkg.pr.new).
# A maintainer adds the `pr preview` label; this builds the two publishable
# packages and publishes them to pkg.pr.new, which serves them from its own
# npm-compatible URLs (nothing is published to the npm registry). The pkg-pr-new
# bot then comments on the PR with install commands like
# `pnpm add https://pkg.pr.new/@cloudflare/nimbus-docs@<PR#>`.
#
# The label is removed at the end, so re-adding it triggers a fresh preview.
#
# Fork PRs work too. The same label starts the Fork preview build, whose
# deploy comments the fork's www Preview; this run uses the fork's copy of this
# file, with a read-only token, after a maintainer approves the run.
on:
  pull_request:
    branches: [main]
    types: [labeled]

# Default-deny; the job opts into exactly what it needs.
permissions: {}

jobs:
  preview:
    name: Build & publish preview
    if: >-
      github.repository == 'cloudflare/nimbus' &&
      github.event.label.name == 'pr preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One preview per PR; a newer label event cancels the older run. Job-level,
    # so runs for other labels, whose job is skipped, don't cancel it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # remove the trigger label (same-repo only; fork tokens are read-only)
    env:
      FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # changelog-github finds the commit that added each changeset
          persist-credentials: false

      # The preview version comes from the branch's package versions. A branch
      # behind the latest release would be stamped as a pre-release of a version
      # that already shipped, which sites on that release reject as older.
      - name: Require the latest release
        run: |
          for pkg in nimbus-docs create-nimbus-docs; do
            branch=$(jq -r .version "packages/$pkg/package.json")
            main=$(git show "origin/main:packages/$pkg/package.json" | jq -r .version)
            if [ "$branch" != "$main" ]; then
              [ "$FORK" = true ] || gh pr edit "$PR" --repo "$REPO" --remove-label "pr preview"
              echo "::error::This branch has @cloudflare/$pkg $branch, but main has $main. Merge main into the branch, then add the label again."
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}

      # Same-repo heads take the URL from the Workers Builds comment. Fork heads
      # wait up to 15 minutes for the Fork preview workflow's comment; either
      # way the URL counts only once it serves this commit.
      - name: Require a live www Preview of this commit
        id: registry
        run: |
          sha=$(git rev-parse HEAD)
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha] | join(" ")')
          read -r state head_sha <<< "$current"
          if [ "$FORK" = true ]; then
            author='github-actions[bot]'
            match='<!-- nimbus-fork-preview -->'
            deadline=$((SECONDS + 900))
          else
            author='cloudflare-workers-and-pages[bot]'
            match='/services/view/nimbus-docs/'
            deadline=$SECONDS
          fi
          while :; do
            comment=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
              --jq ".[] | select(.user.login == \"$author\" and (.body | contains(\"$match\"))) | .id" | sort -n | tail -1)
            url=''
            served_sha=''
            registry_version=''
            if [ -n "$comment" ]; then
              url=$(gh api "repos/$REPO/issues/comments/$comment" --jq '.body' | \
                grep -oE 'Preview URL: https://[A-Za-z0-9.-]+' | head -1 | sed 's/^Preview URL: //') || true
            fi
            if [ -n "$url" ]; then
              served_sha=$(curl --fail --show-error --silent --retry 3 --retry-delay 2 \
                "$url/_nimbus-preview-sha.txt") || true
              registry_version=$(curl --fail --show-error --silent --retry 3 --retry-delay 2 \
                "$url/registry/registry.json" | jq -er '.registryVersion') || true
            fi
            if [ "$served_sha" = "$sha" ] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 15
          done
          if [ "$state" != 'open' ] || [ "$head_sha" != "$sha" ] || [ "$served_sha" != "$sha" ] || \
            [ "$registry_version" != "$(jq -r .version packages/nimbus-docs/package.json)" ]; then
            [ "$FORK" = true ] || gh pr edit "$PR" --repo "$REPO" --remove-label 'pr preview'
            echo "::error::No live www Preview of this PR head (url: ${url:-none}, serving: ${served_sha:-none}). Wait for its build to finish, then reapply the label."
            exit 1
          fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "registry_url=$url/registry" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stamp the packages with the version the release PR would give them, as
      # a pre-release such as 0.16.0-pr.<number>.sha<sha>, so installs select the next
      # release's upgrade entries. The floor changeset gives a package with no
      # pending changeset a patch bump; changesets keeps any larger pending
      # bump. Nothing is committed. changelog-github reads PR metadata, hence
      # the token.
      - name: Stamp preview versions
        run: |
          printf -- '---\n"@cloudflare/nimbus-docs": patch\n"@cloudflare/create-nimbus-docs": patch\n---\n\nPreview version floor.\n' > .changeset/preview-version-floor.md
          pnpm exec changeset version --snapshot "pr.$PR_NUMBER"
          grep -H '"version"' packages/nimbus-docs/package.json packages/create-nimbus-docs/package.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Build only what gets published. The root `build` also builds the private
      # @nimbus/www site + starter source; a failure there must not block a
      # preview. (pkg-pr-new also runs each package's `prepack` when packing, so
      # this is belt-and-suspenders — but it keeps a build break visible as its
      # own step rather than buried in the publish output.)
      - name: Build preview packages
        run: |
          sha=$(git rev-parse HEAD)
          NIMBUS_PREVIEW_REF="${sha:0:7}" pnpm --filter ./packages/nimbus-docs --filter ./packages/create-nimbus-docs build
        env:
          NIMBUS_PREVIEW: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NIMBUS_PREVIEW_REGISTRY_URL: ${{ steps.registry.outputs.registry_url }}

      # Remove the label before publishing so a maintainer can re-add it to
      # retry, even if the publish step below fails.
      - name: Remove preview label
        if: env.FORK != 'true'
        run: gh pr edit "$PR" --repo "$REPO" --remove-label "pr preview"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}

      # Publish both publishable packages in a single invocation. pkg-pr-new is
      # deliberately run ONCE for all packages (running it per-package is how it
      # spams). We publish both unconditionally rather than filtering by pending
      # changesets (as larger monorepos do) — there are only two publishables,
      # and a preview is for testing a branch that may not have a changeset yet.
      #
      #   --pnpm            pack with `pnpm pack` (matches this repo's toolchain)
      #   --compact         short URLs (both packages are on npm with a correct
      #                     `repository` field; falls back to long form if not)
      #   --no-template     skip the Stackblitz playground (irrelevant for a docs framework)
      #   --packageManager  show `pnpm add …` in the PR comment, matching Nimbus's default
      #
      # Prerequisites (one-time, outside this file):
      #   - Install the pkg-pr-new GitHub App (https://github.com/apps/pkg-pr-new)
      #     on cloudflare/nimbus. That is the whole auth: the App learns of each
      #     workflow run and accepts publishes from it while it runs. No token,
      #     no secret, no OIDC. A fork run can therefore publish too, which is
      #     why fork workflow approval must stay at "all external contributors".
      #   - The repo must be PUBLIC. pkg.pr.new serves artifacts from public,
      #     unauthenticated URLs and does not support private repos — same
      #     public-flip prerequisite the npm release already depends on.
      - name: Publish preview
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha] | join(" ")')
          read -r state head_sha <<< "$current"
          PREVIEW_SHA="$(git rev-parse HEAD)"
          served_sha=$(curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            "$PREVIEW_URL/_nimbus-preview-sha.txt")
          if [ "$state" != 'open' ] || [ "$head_sha" != "$PREVIEW_SHA" ] || [ "$served_sha" != "$PREVIEW_SHA" ]; then
            echo '::error::The PR or its live www Preview changed during the package build. Reapply the label.'
            exit 1
          fi
          NIMBUS_PREVIEW_REF="${PREVIEW_SHA:0:7}" pnpm exec pkg-pr-new publish \
            --pnpm \
            --compact \
            --no-template \
            --packageManager=pnpm \
            ./packages/nimbus-docs \
            ./packages/create-nimbus-docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NIMBUS_PREVIEW: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.registry.outputs.preview_url }}
          NIMBUS_PREVIEW_REGISTRY_URL: ${{ steps.registry.outputs.registry_url }}
